AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Data Stack for Document Submission Portal.
  Provisions S3 documents bucket with HTTPS-only policy, CloudWatch log group,
  Secrets Manager database credentials, DB subnet group, RDS PostgreSQL instance,
  and the SQS document-processing queue with its dead-letter queue.

Parameters:
  EnvironmentName:
    Type: String
    Default: dsp
    Description: Environment name prefix.

  AlarmEmail:
    Type: String
    Default: ''
    Description: Optional email address subscribed to CloudWatch alarm notifications (confirm the subscription email).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  # =========================================================================
  # S3 Documents Storage & Security Policy
  # =========================================================================
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSLTLSRequests
            Effect: Deny
            # Principal: '*' is safe because this is an explicit Deny policy restricting insecure transport
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub '${DocumentsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # =========================================================================
  # Alarm Notifications (SNS)
  # Not encrypted with the AWS-managed key: CloudWatch alarms cannot publish to topics
  # that use aws/sns. Messages contain only alarm names and metric values.
  # =========================================================================
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${EnvironmentName}-alarms'

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # =========================================================================
  # CloudWatch Logging
  # =========================================================================
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}-backend"
      RetentionInDays: 7

  # =========================================================================
  # SQS Document Processing Queue (+ Dead-Letter Queue)
  # Backend enqueues a message after upload; the processor Lambda consumes it.
  # After 3 failed receives a message moves to the DLQ for inspection.
  # =========================================================================
  ProcessingDLQ:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    Properties:
      QueueName: !Sub '${EnvironmentName}-processing-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ProcessingQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    Properties:
      QueueName: !Sub '${EnvironmentName}-processing'
      # Must be >= the processor Lambda timeout (30s); 6x is the AWS recommendation
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ProcessingDLQ.Arn
        maxReceiveCount: 3

  ProcessingQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProcessingQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSLTLSRequests
            Effect: Deny
            # Principal: '*' is safe because this is an explicit Deny policy restricting insecure transport
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt ProcessingQueue.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ProcessingDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ProcessingDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSLTLSRequests
            Effect: Deny
            # Principal: '*' is safe because this is an explicit Deny policy restricting insecure transport
            Principal: '*'
            Action: 'sqs:*'
            Resource: !GetAtt ProcessingDLQ.Arn
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # =========================================================================
  # Database Credentials (Secrets Manager)
  # =========================================================================
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "Master credentials for ${EnvironmentName} RDS database"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "dspadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # =========================================================================
  # RDS PostgreSQL Database & Subnet Group
  # =========================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for Document Submission Portal database
      SubnetIds: !Split [',', !ImportValue dsp-network-PrivateSubnets]

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      EngineVersion: '16.15'
      AllocatedStorage: '20'
      StorageType: gp3
      DBName: dspdb
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !ImportValue dsp-network-RDSSecurityGroup
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DeletionProtection: false

  DBSecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref DBInstance
      TargetType: AWS::RDS::DBInstance

# =========================================================================
# Outputs & Cross-Stack Exports
# =========================================================================
Outputs:
  DocumentsBucketName:
    Description: Name of S3 documents bucket
    Value: !Ref DocumentsBucket
    Export:
      Name: dsp-data-DocumentsBucketName

  DocumentsBucketArn:
    Description: ARN of S3 documents bucket
    Value: !GetAtt DocumentsBucket.Arn
    Export:
      Name: dsp-data-DocumentsBucketArn

  DBSecretArn:
    Description: ARN of Secrets Manager secret for database credentials
    Value: !Ref DBSecret
    Export:
      Name: dsp-data-DBSecretArn

  DBEndpoint:
    Description: Endpoint address of RDS PostgreSQL instance
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: dsp-data-DBEndpoint

  AppLogGroupName:
    Description: CloudWatch log group for ECS backend application logs
    Value: !Ref AppLogGroup
    Export:
      Name: dsp-data-AppLogGroupName

  AlarmTopicArn:
    Description: ARN of the SNS topic receiving CloudWatch alarm notifications
    Value: !Ref AlarmTopic
    Export:
      Name: dsp-data-AlarmTopicArn

  ProcessingQueueUrl:
    Description: URL of the document-processing SQS queue
    Value: !Ref ProcessingQueue
    Export:
      Name: dsp-data-ProcessingQueueUrl

  ProcessingQueueArn:
    Description: ARN of the document-processing SQS queue
    Value: !GetAtt ProcessingQueue.Arn
    Export:
      Name: dsp-data-ProcessingQueueArn

  ProcessingDLQName:
    Description: Name of the processing dead-letter queue
    Value: !GetAtt ProcessingDLQ.QueueName
    Export:
      Name: dsp-data-ProcessingDLQName
