<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Submission Portal</title>
  <style>
    :root {
      --bg: #f4f6fa; --surface: #ffffff; --border: #e3e7ee; --text: #1b2430; --muted: #627086;
      --accent: #2f6fdb; --accent-dark: #2459b4;
      --ok: #1a7f4b; --ok-bg: #e4f6ec; --warn: #9a6700; --warn-bg: #fff4d6;
      --info: #1f5fbf; --info-bg: #e3eefc; --bad: #b42318; --bad-bg: #fde8e6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
    header .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; }
    header h1 { font-size: 18px; margin: 0; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    main { padding: 24px 0 48px; }

    .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
    .stat .n { font-size: 26px; font-weight: 600; line-height: 1.1; }
    .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .stat.UPLOADED .n { color: var(--info); } .stat.PROCESSING .n { color: var(--warn); }
    .stat.PROCESSED .n { color: var(--ok); } .stat.FAILED .n { color: var(--bad); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; }
    .card h2 { font-size: 15px; margin: 0; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .card .body { padding: 20px; }

    .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
    .drop { border: 2px dashed #c4cddd; border-radius: 8px; padding: 28px 16px; text-align: center;
      color: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
    .drop.over, .drop:hover { border-color: var(--accent); background: #f3f7ff; }
    .drop strong { color: var(--text); display: block; margin-bottom: 4px; }
    .drop .picked { margin-top: 8px; color: var(--accent-dark); font-weight: 600; word-break: break-all; }
    .drop input { display: none; }
    .fields label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
    .fields .row { margin-bottom: 12px; }
    input[type=text], select, textarea { width: 100%; font: inherit; padding: 8px 10px; background: #fff;
      border: 1px solid #cfd6e3; border-radius: 6px; color: var(--text); }
    input[type=text]:focus, select:focus, textarea:focus { outline: 2px solid #bcd3fa; border-color: var(--accent); }
    textarea { resize: vertical; min-height: 64px; }

    button { font: inherit; border: 0; border-radius: 6px; cursor: pointer; padding: 8px 16px;
      background: var(--accent); color: #fff; font-weight: 600; }
    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.ghost { background: #fff; color: var(--text); border: 1px solid #cfd6e3; padding: 5px 10px; font-weight: 500; font-size: 12px; }
    button.ghost:hover:not(:disabled) { background: #f1f4f9; }
    .progress { height: 6px; background: #e5eaf3; border-radius: 3px; overflow: hidden; margin-top: 12px; display: none; }
    .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }

    .toolbar { display: flex; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .toolbar input { flex: 1; } .toolbar select { width: 180px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
      padding: 10px 20px; background: #fafbfd; border-bottom: 1px solid var(--border); }
    td { padding: 12px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    td.name { font-weight: 600; word-break: break-all; }
    td.name small { display: block; font-weight: 400; color: var(--muted); }
    td.actions { text-align: right; white-space: nowrap; }
    td.actions button { margin-left: 6px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.UPLOADED { background: var(--info-bg); color: var(--info); }
    .badge.PROCESSING { background: var(--warn-bg); color: var(--warn); }
    .badge.PROCESSED { background: var(--ok-bg); color: var(--ok); }
    .badge.FAILED { background: var(--bad-bg); color: var(--bad); }
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

    #toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
    .toast { background: #1b2430; color: #fff; padding: 10px 14px; border-radius: 6px; max-width: 360px; font-size: 13px; }
    .toast.err { background: var(--bad); } .toast.ok { background: var(--ok); }

    button.danger { color: var(--bad); border-color: #f0c2bd; }
    button.danger:hover:not(:disabled) { background: var(--bad-bg); }
    th.chk, td.chk { width: 36px; padding-right: 0; }
    .bulk { display: none; align-items: center; gap: 12px; padding: 10px 20px; background: var(--info-bg); border-bottom: 1px solid var(--border); }
    .bulk.show { display: flex; }
    dialog { border: 1px solid var(--border); border-radius: 10px; padding: 0; width: min(440px, 92vw); color: var(--text); }
    dialog::backdrop { background: rgba(20, 28, 40, .45); }
    dialog form { padding: 20px; }
    dialog h3 { margin: 0 0 8px; font-size: 16px; }
    dialog p { margin: 0 0 12px; color: var(--muted); word-break: break-all; }
    dialog label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
    .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    button.danger-solid { background: var(--bad); } button.danger-solid:hover:not(:disabled) { background: #8f1d14; }

    @media (max-width: 760px) {
      .stats { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: 1fr; }
      th:nth-child(3), td:nth-child(3), th:nth-child(6), td:nth-child(6) { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Document Submission Portal</h1>
      <p>Secure upload and processing tracker</p>
    </div>
  </header>

  <main class="wrap">
    <div class="stats" id="stats"></div>

    <div class="card">
      <h2>Upload a document</h2>
      <div class="body">
        <form id="upload-form" novalidate>
          <div class="grid">
            <label class="drop" id="drop" for="file">
              <strong>Drag a file here or click to browse</strong>
              PDF, DOCX, PNG or JPG, up to 10 MB
              <div class="picked" id="picked"></div>
              <input id="file" type="file" accept=".pdf,.docx,.png,.jpg,.jpeg">
            </label>
            <div class="fields">
              <div class="row">
                <label for="document_type">Document type</label>
                <select id="document_type">
                  <option value="">Select a type</option>
                  <option>Identity</option>
                  <option>Invoice</option>
                  <option>Contract</option>
                  <option>Report</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="row">
                <label for="description">Description (optional)</label>
                <textarea id="description" maxlength="500"></textarea>
              </div>
              <button type="submit" id="submit">Upload</button>
            </div>
          </div>
          <div class="progress" id="progress"><div id="bar"></div></div>
        </form>
      </div>
    </div>

    <div class="card">
      <h2>Documents</h2>
      <div class="toolbar">
        <input id="search" type="text" placeholder="Search by filename or description">
        <select id="status-filter">
          <option value="">All statuses</option>
          <option>UPLOADED</option>
          <option>PROCESSING</option>
          <option>PROCESSED</option>
          <option>FAILED</option>
        </select>
      </div>
      <div class="bulk" id="bulk"><span id="bulk-count"></span><button class="ghost danger" id="bulk-delete" type="button">Delete selected</button></div>
      <table>
        <thead>
          <tr><th class="chk"><input type="checkbox" id="check-all" aria-label="Select all"></th><th>File</th><th>Type</th><th>Size</th><th>Status</th><th>Uploaded</th><th></th></tr>
        </thead>
        <tbody id="docs"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No documents found.</div>
    </div>
  </main>

  <dialog id="edit-dlg">
    <form method="dialog" id="edit-form">
      <h3>Edit document</h3>
      <p id="edit-name"></p>
      <label for="edit-type">Document type</label>
      <select id="edit-type">
        <option>Identity</option><option>Invoice</option><option>Contract</option><option>Report</option><option>Other</option>
      </select>
      <label for="edit-desc">Description</label>
      <textarea id="edit-desc" maxlength="500"></textarea>
      <div class="dlg-actions">
        <button type="button" class="ghost" id="edit-cancel">Cancel</button>
        <button type="submit" id="edit-save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="del-dlg">
    <form method="dialog" id="del-form">
      <h3>Delete documents</h3>
      <p id="del-text"></p>
      <p>This permanently removes the file from storage and cannot be undone.</p>
      <div class="dlg-actions">
        <button type="button" class="ghost" id="del-cancel">Cancel</button>
        <button type="submit" class="danger-solid" id="del-confirm">Delete</button>
      </div>
    </form>
  </dialog>

  <div id="toasts"></div>

  <script>
    const MAX_BYTES = 10 * 1024 * 1024;
    const EXTS = [".pdf", ".docx", ".png", ".jpg", ".jpeg"];
    const $ = (id) => document.getElementById(id);
    let selectedFile = null;

    function toast(text, kind) {
      const t = document.createElement("div");
      t.className = "toast " + (kind || "");
      t.textContent = text;
      $("toasts").appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    function fmtSize(b) {
      if (b < 1024) return b + " B";
      if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
      return (b / 1024 / 1024).toFixed(1) + " MB";
    }

    function fmtTime(iso) {
      const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60) return "just now";
      if (s < 3600) return Math.floor(s / 60) + " min ago";
      if (s < 86400) return Math.floor(s / 3600) + " h ago";
      return new Date(iso).toLocaleDateString();
    }

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function setFile(f) {
      selectedFile = f || null;
      $("picked").textContent = f ? f.name + " (" + fmtSize(f.size) + ")" : "";
    }

    function validate() {
      if (!selectedFile) return "Choose a file to upload.";
      const dot = selectedFile.name.lastIndexOf(".");
      const ext = dot >= 0 ? selectedFile.name.slice(dot).toLowerCase() : "";
      if (!EXTS.includes(ext)) return "Unsupported file type. Use PDF, DOCX, PNG or JPG.";
      if (selectedFile.size > MAX_BYTES) return "File is larger than 10 MB.";
      if (!$("document_type").value) return "Select a document type.";
      return null;
    }

    async function loadStats() {
      try {
        const r = await fetch("/api/stats");
        if (!r.ok) return;
        const s = await r.json();
        const box = $("stats");
        box.textContent = "";
        for (const k of ["total", "UPLOADED", "PROCESSING", "PROCESSED", "FAILED"]) {
          const c = el("div", "stat " + k);
          c.appendChild(el("div", "n", String(s[k])));
          c.appendChild(el("div", "l", k === "total" ? "Total" : k.charAt(0) + k.slice(1).toLowerCase()));
          box.appendChild(c);
        }
      } catch (_) {}
    }

    async function download(d, btn) {
      btn.disabled = true;
      try {
        const r = await fetch("/api/documents/" + d.document_id + "/download");
        if (!r.ok) throw new Error();
        const { url } = await r.json();
        const a = document.createElement("a");
        a.href = url;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (_) {
        toast("Could not generate the download link.", "err");
      } finally {
        btn.disabled = false;
      }
    }

    async function retry(d, btn) {
      btn.disabled = true;
      const r = await fetch("/api/documents/" + d.document_id + "/retry", { method: "POST" });
      toast(r.ok ? "Retry started." : "Retry failed.", r.ok ? "ok" : "err");
      refresh();
    }

    async function loadDocs() {
      const p = new URLSearchParams();
      if ($("search").value) p.set("search", $("search").value);
      if ($("status-filter").value) p.set("status", $("status-filter").value);
      let docs;
      try {
        const r = await fetch("/api/documents?" + p.toString());
        if (!r.ok) return;
        docs = await r.json();
      } catch (_) { return; }

      const body = $("docs");
      body.textContent = "";
      $("empty").style.display = docs.length ? "none" : "block";
      for (const d of docs) {
        const tr = document.createElement("tr");

        const ck = el("td", "chk");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = selected.has(d.document_id);
        cb.addEventListener("change", () => { cb.checked ? selected.add(d.document_id) : selected.delete(d.document_id); updateBulk(); });
        ck.appendChild(cb);
        tr.appendChild(ck);

        const name = el("td", "name", d.original_filename);
        if (d.description) name.appendChild(el("small", "", d.description));
        if (d.status === "FAILED" && d.error_message) name.appendChild(el("small", "", d.error_message));
        tr.appendChild(name);

        tr.appendChild(el("td", "", d.document_type));
        tr.appendChild(el("td", "", fmtSize(d.size_bytes)));

        const st = document.createElement("td");
        st.appendChild(el("span", "badge " + d.status, d.status.charAt(0) + d.status.slice(1).toLowerCase()));
        tr.appendChild(st);

        tr.appendChild(el("td", "", fmtTime(d.created_at)));

        const act = el("td", "actions");
        if (d.status === "FAILED") {
          const rb = el("button", "ghost", "Retry");
          rb.addEventListener("click", () => retry(d, rb));
          act.appendChild(rb);
        }
        const db = el("button", "ghost", "Download");
        db.addEventListener("click", () => download(d, db));
        act.appendChild(db);
        tr.appendChild(act);

        body.appendChild(tr);
      }
    }

    const selected = new Set();
    let currentDocs = [];
    let editing = null;
    let pendingDelete = [];

    function updateBulk() {
      $("bulk").classList.toggle("show", selected.size > 0);
      $("bulk-count").textContent = selected.size + " selected";
      $("check-all").checked = currentDocs.length > 0 && selected.size === currentDocs.length;
    }

    function openEdit(d) {
      editing = d;
      $("edit-name").textContent = d.original_filename;
      const sel = $("edit-type");
      if (![...sel.options].some((o) => o.value === d.document_type)) sel.add(new Option(d.document_type));
      sel.value = d.document_type;
      $("edit-desc").value = d.description || "";
      $("edit-dlg").showModal();
    }

    function confirmDelete(docs) {
      pendingDelete = docs;
      $("del-text").textContent = docs.length === 1 ? docs[0].original_filename : docs.length + " documents selected";
      $("del-dlg").showModal();
    }

    $("edit-cancel").addEventListener("click", () => $("edit-dlg").close());
    $("del-cancel").addEventListener("click", () => $("del-dlg").close());

    $("edit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("edit-save").disabled = true;
      const r = await fetch("/api/documents/" + editing.document_id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ document_type: $("edit-type").value, description: $("edit-desc").value }),
      });
      $("edit-save").disabled = false;
      $("edit-dlg").close();
      toast(r.ok ? "Document updated." : "Update failed.", r.ok ? "ok" : "err");
      refresh();
    });

    $("del-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("del-confirm").disabled = true;
      const results = await Promise.all(
        pendingDelete.map((d) => fetch("/api/documents/" + d.document_id, { method: "DELETE" }).then((r) => r.ok).catch(() => false))
      );
      $("del-confirm").disabled = false;
      $("del-dlg").close();
      const failed = results.filter((ok) => !ok).length;
      pendingDelete.forEach((d) => selected.delete(d.document_id));
      toast(failed ? failed + " delete(s) failed." : "Deleted.", failed ? "err" : "ok");
      refresh();
    });

    $("bulk-delete").addEventListener("click", () => confirmDelete(currentDocs.filter((d) => selected.has(d.document_id))));
    $("check-all").addEventListener("change", (e) => {
      selected.clear();
      if (e.target.checked) currentDocs.forEach((d) => selected.add(d.document_id));
      loadDocs();
    });

    function refresh() { loadStats(); loadDocs(); }

    function upload(fd) {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/api/documents");
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) $("bar").style.width = Math.round((e.loaded / e.total) * 100) + "%";
        };
        xhr.onload = () => {
          let detail = null;
          try { detail = JSON.parse(xhr.responseText).detail; } catch (_) {}
          resolve({ ok: xhr.status >= 200 && xhr.status < 300, detail });
        };
        xhr.onerror = () => resolve({ ok: false, detail: "Network error." });
        xhr.send(fd);
      });
    }

    $("file").addEventListener("change", (e) => setFile(e.target.files[0]));
    const drop = $("drop");
    ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => { if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });

    $("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const problem = validate();
      if (problem) { toast(problem, "err"); return; }

      const fd = new FormData();
      fd.append("file", selectedFile);
      fd.append("document_type", $("document_type").value);
      if ($("description").value.trim()) fd.append("description", $("description").value.trim());

      $("submit").disabled = true;
      $("submit").textContent = "Uploading...";
      $("progress").style.display = "block";
      $("bar").style.width = "0";

      const res = await upload(fd);

      $("submit").disabled = false;
      $("submit").textContent = "Upload";
      $("progress").style.display = "none";
      if (res.ok) {
        toast("Document uploaded.", "ok");
        e.target.reset();
        setFile(null);
      } else {
        toast(typeof res.detail === "string" ? res.detail : "Upload failed.", "err");
      }
      refresh();
    });

    let debounce;
    $("search").addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(loadDocs, 250); });
    $("status-filter").addEventListener("change", loadDocs);

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
