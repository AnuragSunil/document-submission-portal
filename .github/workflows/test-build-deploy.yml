name: Test, Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate CloudFormation Network Template
        run: |
          python3 -c "import yaml; yaml.safe_load(open('infra/network.yaml'))"
          echo "Network template YAML is valid."
